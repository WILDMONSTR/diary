<style>

{color:#a09caf;font-size:11px}.section-title{font-size:18px;font-weight:850;letter-spacing:-.6px}.section-description{font-size:12px;color:var(--muted);margin-top:4px}.activity-item{position:relative;padding:0 0 19px 28px;margin-left:7px;border-left:1.5px solid #eeeaf7}.activity-item:last-child{border-left-color:transparent;padding-bottom:0}.timeline-dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#b4aafc;border:3px solid #f1efff;left:-7px;top:3px}.activity-title{font-size:12px;font-weight:800}.activity-time{font-size:10px;color:#a09caf;margin-top:3px}.activity-note{font-size:11px;color:#77748b;line-height:1.65;margin-top:7px;white-space:pre-wrap;overflow-wrap:anywhere}.history-row{padding:13px 0;border-bottom:1px solid #f2f0f7}.history-row:last-child{border-bottom:0}.history-row strong{display:block;font-size:12px}.history-row small{display:block;margin-top:4px;color:#9995ad;font-size:10px}.history-diff{margin-top:7px;border-radius:10px;background:#faf9ff;padding:9px 10px;color:#77718f;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}.modal-backdrop{position:fixed;inset:0;background:#30294760;backdrop-filter:blur(5px);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}.modal{width:min(630px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 25px 80px #33284b36}.modal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.modal-header h2{font-size:20px;margin:0;letter-spacing:-.5px}.modal-header p{font-size:11px;color:var(--muted);margin:5px 0 0}.close-btn{height:34px;width:34px;border-radius:11px;background:#f7f5fb;color:#89849f;font-size:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-field{display:flex;flex-direction:column;gap:6px;min-width:0}.form-field.full{grid-column:1/-1}.form-field label{font-size:11px;font-weight:800;color:#716e86}.form-field input,.form-field select,.form-field textarea{width:100%;border:1px solid #e9e6f1;border-radius:11px;padding:11px 12px;color:var(--ink);background:#fff;font-size:12px;min-width:0}.form-field textarea{min-height:84px;resize:vertical}.form-field input::placeholder,.form-field textarea::placeholder{color:#c0bdcd}.form-help{font-size:10px;color:#aaa6b8}.form-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:19px;padding-top:16px;border-top:1px solid #f2f0f7}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#302b44;color:#fff;border-radius:13px;padding:12px 17px;font-size:12px;font-weight:700;box-shadow:0 10px 30px #211b3630;z-index:50;max-width:calc(100vw - 30px);animation:toastin .18s ease-out}.hint-box{border-radius:14px;padding:13px;background:#fff9e9;color:#8b7843;font-size:11px;line-height:1.6}.footer-note{font-size:10px;color:#b2afc0;text-align:center;margin-top:26px}.mobile-menu{display:none}.hide{display:none!important}

@media(max-width:720px){.layout{display:block}.sidebar{position:static;height:auto;padding:13px 15px;border-right:0;border-bottom:1px solid var(--line);gap:12px}.brand{padding:0 4px}.brand-icon{height:36px;width:36px;border-radius:12px;font-size:19px}.brand strong{font-size:15px}.brand small{display:none}.nav-label,.side-note,.side-bottom{display:none}.nav{display:flex;gap:5px;overflow:auto;padding-bottom:2px}.nav button{width:auto;white-space:nowrap;padding:9px 11px;font-size:11px}.nav .ico{font-size:15px;width:auto}.main{padding:22px 14px 35px}.topbar{align-items:flex-start;margin-bottom:22px}.page-title{font-size:23px}.today-pill{display:none}.stats{gap:10px;margin:18px 0}.stat{padding:14px;border-radius:17px}.stat-value{font-size:25px}.stat-icon{width:32px;height:32px;border-radius:11px}.stat-top{font-size:10px}.stat-foot{font-size:10px}.welcome{padding:21px;border-radius:19px}.welcome h2{font-size:20px}.welcome-art{font-size:42px;padding:0}.panel{padding:17px;border-radius:18px}.plan-list{grid-template-columns:1fr}.page-toolbar{align-items:stretch}.toolbar-controls{width:100%}.search{width:100%;flex:1}.toolbar-controls .field-control{flex:1;min-width:115px}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.modal{padding:19px;border-radius:20px}.top-actions{gap:6px}.top-actions .btn{padding:9px 10px}.page-sub{max-width:95%}.welcome p{max-width:280px}}

<body>
<div class="layout">
<aside class="sidebar">
  <div class="brand"><div class="brand-icon">✿</div><div><strong>Mellow Diary</strong><small>little steps, lovely days</small></div></div>
  <div><div class="nav-label">WORKSPACE</div><nav class="nav" id="nav">
    <button class="active" data-page="home"><span class="ico">⌂</span> 대시보드</button>
    <button data-page="plans"><span class="ico">✿</span> 계획</button>
    <button data-page="tasks"><span class="ico">☑</span> 할 일</button>
    <button data-page="activity"><span class="ico">◷</span> 실행 기록</button>
    <button data-page="review"><span class="ico">♡</span> 돌아보기</button>
  </nav></div>
  <div class="side-note"><div class="emoji">🌷</div><b>작은 걸음도 충분해요</b><p>완벽한 하루보다 나에게 맞는 속도로 쌓아가는 기록을 응원해요.</p></div>
  <div class="side-bottom">MADE FOR YOUR EVERYDAY · 2026</div>
</aside>
<main class="main">
  <header class="topbar"><div><div class="eyebrow" id="eyebrow">YOUR PERSONAL SPACE</div><h1 class="page-title" id="pageTitle">오늘도, 나답게 ✨</h1><p class="page-sub" id="pageSub">생각을 정리하고 작은 성취를 모아보세요.</p></div><div class="top-actions"><div class="today-pill" id="todayPill"></div><button class="btn btn-primary" data-action="new-task">＋ 새 할 일</button></div></header>
  <section id="appContent"></section>
  <div class="footer-note">당신의 속도로, 당신의 이야기를 기록해요 ✿</div>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div>
<input id="importInput" class="hide" type="file" accept="application/json">
<script>
(function(){
"use strict";
const STORE_KEY="mellow-diary-v1";
const labels={home:["YOUR PERSONAL SPACE","오늘도, 나답게 ✨","생각을 정리하고 작은 성취를 모아보세요."],plans:["GENTLE PLANNING","나의 계획","하고 싶은 일과 도달하고 싶은 모습을 정리해요."],tasks:["LITTLE BY LITTLE","할 일 목록","오늘의 작은 실천을 찾고, 나에게 맞는 순서로 정리해요."],activity:["REAL LIFE LOG","실행 기록","계획과 별개로 실제로 해본 것들을 남겨요."],review:["LOOKING BACK","돌아보기","얼마나 해냈는지보다 무엇을 배웠는지도 살펴봐요."]};
const blank=()=>({plans:[],tasks:[],runs:[],completionEvents:[]});
let data=loadData(),page="home",query="",statusFilter="all",priorityFilter="all",tagFilter="",sortMode="due",toastTimer;
function loadData(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return blank();const d=JSON.parse(raw);return{plans:Array.isArray(d.plans)?d.plans:[],tasks:Array.isArray(d.tasks)?d.tasks:[],runs:Array.isArray(d.runs)?d.runs:[],completionEvents:Array.isArray(d.completionEvents)?d.completionEvents:[]}}catch(e){return blank()}}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(data));return true}catch(e){showToast("저장 공간이 부족해요. 데이터 내보내기로 백업해 주세요.");return false}}
function id(){return (typeof crypto!=="undefined"&&crypto.randomUUID)?crypto.randomUUID():("id-"+Date.now()+"-"+Math.random().toString(36).slice(2,10))}
function nowISO(){return new Date().toISOString()}
function dateInputNow(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDate(v,withTime){if(!v)return"날짜 미정";const d=new Date(v);if(Number.isNaN(d.getTime()))return esc(v);return new Intl.DateTimeFormat("ko-KR",withTime?{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}:{year:"numeric",month:"short",day:"numeric"}).format(d)}
function fmtMinutes(m){m=Number(m)||0;if(m<60)return m+"분";const h=Math.floor(m/60),r=m%60;return h+"시간"+(r?" "+r+"분":"")}
function dueValue(v){if(!v)return Number.MAX_SAFE_INTEGER;const n=new Date(v+"T23:59:59").getTime();return Number.isNaN(n)?Number.MAX_SAFE_INTEGER:n}
function getPlan(pid){return data.plans.find(p=>p.id===pid)}
function getTask(tid){return data.tasks.find(t=>t.id===tid)}
function currentPlanSnapshot(p){return {title:p.title,category:p.category||"",description:p.description||"",startDate:p.startDate||"",endDate:p.endDate||"",successCriteria:p.successCriteria||"",estimatedMinutes:Number(p.estimatedMinutes)||0,status:p.status||"active"}}
function planLabel(pid){const p=getPlan(pid);return p?p.title:"독립 할 일"}
function priorityLabel(p){return p==="high"?"높음":p==="medium"?"보통":"낮음"}
function statusLabel(s){return s==="done"?"완료":s==="inprogress"?"진행 중":"할 일"}
function statusTag(s){return '<span class="tag '+(s==="done"?"tag-mint":s==="inprogress"?"tag-blue":"tag-pink")+'">'+statusLabel(s)+'</span>'}
function priorityMark(p){return '<span class="priority '+esc(p)+'">● '+priorityLabel(p)+'</span>'}
function showToast(msg){const root=document.getElementById("toastRoot");root.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML="",2600)}
function allTagNames(){const set=new Set();data.tasks.forEach(t=>(t.tags||[]).forEach(x=>{if(x.trim())set.add(x.trim())}));return Array.from(set).sort((a,b)=>a.localeCompare(b,"ko"))}
function setPage(p){page=p;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));const l=labels[page]||labels.home;document.getElementById("eyebrow").textContent=l[0];document.getElementById("pageTitle").textContent=l[1];document.getElementById("pageSub").textContent=l[2];document.getElementById("todayPill").textContent=new Intl.DateTimeFormat("ko-KR",{month:"long",day:"numeric",weekday:"short"}).format(new Date());render()}
function stats(){const done=data.completionEvents.length;const open=data.tasks.filter(t=>t.status!=="done").length;const mins=data.runs.reduce((a,r)=>a+(Number(r.durationMinutes)||0),0);const planMins=data.plans.reduce((a,p)=>a+(Number(p.estimatedMinutes)||0),0);return{done:done,open:open,mins:mins,planMins:planMins}}
function statCard(icon,label,value,foot,tone){return '<div class="stat"><div class="stat-top"><span>'+label+'</span><span class="stat-icon '+tone+'">'+icon+'</span></div><div class="stat-value">'+value+'</div><div class="stat-foot">'+foot+'</div></div>'}
function empty(emoji,title,desc,action,label){return '<div class="empty"><div class="empty-emoji">'+emoji+'</div><b>'+title+'</b><p>'+desc+'</p>'+(action?'<button class="btn btn-soft btn-small" data-action="'+action+'">'+label+'</button>':"")+'</div>'}
function taskTags(t){return(t.tags||[]).slice(0,4).map((x,i)=>'<span class="tag '+["","tag-pink","tag-mint","tag-yellow","tag-blue"][i%5]+'">'+esc(x)+'</span>').join("")}
function taskRow(t,compact){const done=t.status==="done";const plan=t.planId?planLabel(t.planId):"독립 할 일";return '<div class="task-row"><button class="check '+(done?"done":"")+'" data-action="'+(done?"reopen-task":"complete-task")+'" data-id="'+esc(t.id)+'" aria-label="'+(done?"진행으로 되돌리기":"완료 처리")+'">'+(done?"✓":"")+'</button><div class="task-content"><div class="task-title '+(done?"is-done":"")+'">'+esc(t.title)+'</div><div class="task-meta"><span>'+esc(plan)+'</span>'+(t.dueDate?'<span>· 마감 '+fmtDate(t.dueDate):"")+'</span><span>· '+fmtMinutes(t.estimatedMinutes)+'</span>'+(compact?"":'<span>· '+statusLabel(t.status)+'</span>')+'</div>'+(compact?"":'<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:7px">'+taskTags(t)+'</div>')+'</div><div class="task-right">'+priorityMark(t.priority||"medium")+(compact?"":'<button class="btn btn-white btn-small" data-action="edit-task" data-id="'+esc(t.id)+'">수정</button>')+'</div></div>'}

function renderHome(){const s=stats(),upcoming=data.tasks.filter(t=>t.status!=="done").sort((a,b)=>dueValue(a.dueDate)-dueValue(b.dueDate)).slice(0,4),recent=data.runs.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,3),plans=data.plans.slice(0,3);return '<div class="welcome"><div><span class="tag">✦ YOUR GENTLE SPACE</span><h2>작은 걸음도 모이면<br>멋진 하루가 돼요.</h2><p>오늘 하고 싶은 것 한 가지부터 시작해 볼까요?<br>일상, 공부, 취미, 어떤 계획이든 환영해요.</p><button class="btn btn-primary" data-action="new-plan">＋ 나의 계획 만들기</button></div><div class="welcome-art" aria-hidden="true">🌷</div></div><div class="grid stats">'+statCard("☑","완료 기록",s.done+"개","완료 처리 이벤트 누적","tone-purple")+statCard("✿","남은 할 일",s.open+"개","천천히 하나씩 해봐요","tone-pink")+statCard("◷","실제 기록 시간",fmtMinutes(s.mins),"실행 기록을 기준으로 계산","tone-mint")+statCard("♡","계획 예상 시간",fmtMinutes(s.planMins),"현재 계획에 저장된 예상 시간","tone-yellow")+'</div><div class="grid home-grid"><div><section class="panel"><div class="panel-head"><div><div class="panel-title">다가오는 할 일 🌱</div><div class="panel-sub">가장 먼저 챙기면 좋을 작은 실천</div></div><button class="link-btn" data-page="tasks">전체 보기 →</button></div><div class="item-list">'+(upcoming.length?upcoming.map(t=>taskRow(t,true)).join(""):empty("🫧","아직 할 일이 없어요","계획에 할 일을 추가하거나, 지금 떠오르는 일을 적어보세요.","new-task","첫 할 일 만들기"))+'</div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">최근 실행 기록 📝</div><div class="panel-sub">계획과 별개로 남긴 실제 활동</div></div><button class="link-btn" data-page="activity">기록 더 보기 →</button></div>'+(recent.length?recent.map(r=>'<div class="activity-item"><div class="timeline-dot"></div><div class="activity-title">'+esc(r.title||r.taskTitleSnapshot||"실행 기록")+'</div><div class="activity-time">'+fmtDate(r.startedAt,true)+' · '+fmtMinutes(r.durationMinutes)+'</div>'+(r.blocker?'<div class="activity-note">막힌 부분: '+esc(r.blocker)+'</div>':"")+'</div>').join(""):empty("📝","첫 기록을 남겨보세요","얼마나 걸렸는지, 어디서 막혔는지 기록하면 다음 시도에 도움이 돼요.","new-run","실행 기록 남기기"))+'</section></div><div><section class="panel"><div class="panel-head"><div><div class="panel-title">나의 계획 ✨</div><div class="panel-sub">목표와 성공 기준을 한눈에</div></div><button class="link-btn" data-page="plans">모두 보기 →</button></div>'+(plans.length?'<div class="item-list">'+plans.map(p=>'<div><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b style="font-size:12px">'+esc(p.title)+'</b><span class="tag">'+esc(p.category||"일반")+'</span></div><div class="progress-line"><span style="width:'+(data.tasks.filter(t=>t.planId===p.id).length?Math.round(data.tasks.filter(t=>t.planId===p.id&&t.status==="done").length/data.tasks.filter(t=>t.planId===p.id).length*100):0)+'%"></span></div><div class="progress-caption"><span>'+data.tasks.filter(t=>t.planId===p.id&&t.status==="done").length+'개 완료</span><button class="link-btn" data-action="edit-plan" data-id="'+esc(p.id)+'">열기 →</button></div></div>').join("")+'</div>':empty("🎈","첫 계획을 만들어볼까요?","기간과 성공 기준, 예상 시간을 적어두면 더 선명해져요.","new-plan","계획 작성"))+'</section><section class="panel"><div class="panel-head"><div><div class="panel-title">오늘의 응원 💌</div><div class="panel-sub">기억해 주세요</div></div></div><div style="border-radius:15px;padding:17px;background:linear-gradient(135deg,#f0efff,#fff0f5);font-size:13px;font-weight:750;line-height:1.9;color:#766d9a">모든 걸 끝내야만<br>좋은 하루인 건 아니에요.<br>시작한 것도, 배운 것도<br>모두 의미 있는 기록이에요. 🌼</div></section></div></div>'}
function renderPlans(){return '<div class="page-toolbar"><div><div class="section-title">내가 이어가고 싶은 것</div><div class="section-description">계획을 고쳐도 이전 버전은 이력으로 남아요.</div></div><button class="btn btn-primary" data-action="new-plan">＋ 새 계획</button></div>'+(data.plans.length?'<div class="plan-list">'+data.plans.map(planCard).join("")+'</div>':empty("🌈","첫 번째 계획을 만들어보세요","기간, 성공 기준, 예상 시간을 적고 나만의 계획을 시작해요.","new-plan","계획 만들기"))}
function filteredTasks(){let arr=data.tasks.slice();if(query.trim()){const q=query.trim().toLowerCase();arr=arr.filter(t=>[t.title,t.description,(t.tags||[]).join(" "),planLabel(t.planId)].some(v=>String(v||"").toLowerCase().includes(q)))}if(statusFilter!=="all")arr=arr.filter(t=>t.status===statusFilter);if(priorityFilter!=="all")arr=arr.filter(t=>t.priority===priorityFilter);if(tagFilter)arr=arr.filter(t=>(t.tags||[]).includes(tagFilter));const pr={high:0,medium:1,low:2};arr.sort((a,b)=>{if(sortMode==="priority")return(pr[a.priority]??1)-(pr[b.priority]??1)||dueValue(a.dueDate)-dueValue(b.dueDate);if(sortMode==="estimate")return(Number(a.estimatedMinutes)||0)-(Number(b.estimatedMinutes)||0);if(sortMode==="newest")return new Date(b.createdAt)-new Date(a.createdAt);if(sortMode==="title")return a.title.localeCompare(b.title,"ko");return dueValue(a.dueDate)-dueValue(b.dueDate)});return arr}

option></select></div><div class="result-caption" style="margin-bottom:11px">총 '+arr.length+'개 · 화면 표시 기준: '+sortLabel+'</div><section class="panel"><div class="item-list">'+(arr.length?arr.map(t=>'<div class="task-row"><button class="check '+(t.status==="done"?"done":"")+'" data-action="'+(t.status==="done"?"reopen-task":"complete-task")+'" data-id="'+esc(t.id)+'" aria-label="'+(t.status==="done"?"진행으로 되돌리기":"완료 처리")+'">'+(t.status==="done"?"✓":"")+'</button><div class="task-content"><div class="task-title '+(t.status==="done"?"is-done":"")+'">'+esc(t.title)+'</div><div class="task-meta"><span>'+esc(planLabel(t.planId))+'</span><span>· 마감 '+fmtDate(t.dueDate)+'</span><span>· 예상 '+fmtMinutes(t.estimatedMinutes)+'</span><span>· '+statusLabel(t.status)+'</span></div>'+(t.description?'<div class="activity-note">'+esc(t.description)+'</div>':"")+'<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:7px">'+taskTags(t)+'</div></div><div class="task-right">'+priorityMark(t.priority||"medium")+'<button class="btn btn-white btn-small" data-action="edit-task" data-id="'+esc(t.id)+'">수정</button><button class="btn btn-danger btn-small" data-action="delete-task" data-id="'+esc(t.id)+'">삭제</button><button class="btn btn-soft btn-small" data-action="new-run" data-task="'+esc(t.id)+'">＋ 실행 기록</button></div></div>').join(""):empty("🍡","조건에 맞는 할 일이 없어요","검색어나 필터를 바꾸거나 새로운 할 일을 추가해 보세요.","new-task","할 일 추가"))+'</div></section>'}
function renderActivity(){const arr=data.runs.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return '<div class="page-toolbar"><div><div class="section-title">실제로 해본 것 기록하기 📝</div><div class="section-description">실제 시간과 막힌 이유는 계획 값을 바꾸지 않아요.</div></div><button class="btn btn-primary" data-action="new-run">＋ 실행 기록</button></div><section class="panel"><div class="panel-head"><div><div class="panel-title">실행 타임라인</div><div class="panel-sub">총 '+arr.length+'건 · 소요 시간 합계 '+fmtMinutes(arr.reduce((a,r)=>a+(Number(r.durationMinutes)||0),0))+'</div></div></div>'+(arr.length?arr.map(r=>'<div class="activity-item"><div class="timeline-dot"></div><div class="activity-title">'+esc(r.title||r.taskTitleSnapshot||"실행 기록")+'</div><div class="activity-time">'+fmtDate(r.startedAt,true)+' · '+fmtMinutes(r.durationMinutes)+' · '+esc(r.taskTitleSnapshot||"독립 기록")+'</div>'+(r.blocker?'<div class="activity-note"><b>막힌 부분</b><br>'+esc(r.blocker)+'</div>':"")+(r.note?'<div class="activity-note"><b>메모</b><br>'+esc(r.note)+'</div>':"")+'<div style="margin-top:7px"><button class="btn btn-danger btn-small" data-action="delete-run" data-id="'+esc(r.id)+'">기록 삭제</button></div></div>').join(""):empty("🌤️","아직 실행 기록이 없어요","시작 시각과 소요 시간, 막힌 부분을 기록해 다음번에 참고하세요.","new-run","기록 남기기"))+'</section>'}
function renderReview(){const s=stats(),byPlan=data.plans.map(p=>{const ts=data.tasks.filter(t=>t.planId===p.id);return{p:p,total:ts.length,done:ts.filter(t=>t.status==="done").length,mins:data.runs.filter(r=>r.planId===p.id).reduce((n,r)=>n+(Number(r.durationMinutes)||0),0)}});const events=data.completionEvents.slice().sort((a,b)=>new Date(b.at)-new Date(a.at));return '<div class="grid stats">'+statCard("☑","완료 기록",s.done+"회","완료 상태로 바뀐 횟수","tone-purple")+statCard("◷","실행한 시간",fmtMinutes(s.mins),"실행 기록의 소요 시간 합계","tone-mint")+statCard("✿","진행 중 할 일",s.open+"개","지금 이어갈 수 있는 일","tone-pink")+statCard("⌁","계획 예상 시간",fmtMinutes(s.planMins),"실제 시간과 별도로 보존","tone-yellow")+'</div><div class="grid home-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">계획별 돌아보기 🌱</div><div class="panel-sub">현재 상태와 연결된 실제 기록 시간을 나눠서 보여줘요.</div></div></div>'+(byPlan.length?byPlan.map(x=>'<div class="history-row"><strong>'+esc(x.p.title)+'</strong><small>완료 '+x.done+' / '+x.total+'개 · 계획 예상 '+fmtMinutes(x.p.estimatedMinutes)+' · 실제 기록 '+fmtMinutes(x.mins)+'</small><div class="progress-line"><span style="width:'+(x.total?Math.round(x.done/x.total*100):0)+'%"></span></div>'+(x.p.successCriteria?'<div class="history-diff"><b>성공 기준</b><br>'+esc(x.p.successCriteria)+'</div>':"")+'</div>').join(""):empty("🪴","아직 돌아볼 계획이 없어요","계획과 할 일을 추가하면 이곳에 진행 상황이 모여요.","new-plan","계획 추가"))+'</section><section class="panel"><div class="panel-head"><div><div class="panel-title">완료 히스토리 💖</div><div class="panel-sub">완료 이벤트가 중복 없이 누적돼요.</div></div></div>'+(events.length?events.slice(0,12).map(e=>'<div class="history-row"><strong>✓ '+esc(e.taskTitleSnapshot||"완료한 할 일")+'</strong><small>'+fmtDate(e.at,true)+'</small></div>').join(""):empty("🎀","첫 완료를 기다리고 있어요","할 일을 완료로 바꾸면 이력이 기록돼요."))+'</section></div><section class="panel" style="margin-top:18px"><div class="panel-head"><div><div class="panel-title">나의 데이터 관리</div><div class="panel-sub">현재 기록은 이 브라우저에 저장됩니다. 주기적으로 백업 파일을 내려받아 주세요.</div></div></div><div class="card-actions"><button class="btn btn-soft" data-action="export-data">↧ 데이터 내보내기</button><button class="btn btn-white" data-action="import-data">↥ 백업 가져오기</button><button class="btn btn-white" data-action="show-storage-note">저장 방식 안내</button></div><div class="hint-box" style="margin-top:13px">🔒 개인 정보 보호: 이 버전은 데이터를 서버로 전송하지 않고 현재 브라우저의 로컬 저장소에 보관합니다. 브라우저 데이터 삭제 또는 다른 기기에서는 기록이 사라지거나 보이지 않을 수 있어요. 백업 파일을 안전한 곳에 보관하세요.</div></section>'}

function inputField(label,name,value,type,opts){opts=opts||{};let html='<div class="form-field '+(opts.full?"full":"")+'"><label for="'+name+'">'+label+'</label>';if(type==="textarea")html+='<textarea id="'+name+'" name="'+name+'" placeholder="'+esc(opts.placeholder||"")+'">'+esc(value||"")+'</textarea>';else if(type==="select")html+='<select id="'+name+'" name="'+name+'">'+opts.options.map(o=>'<option value="'+esc(o[0])+'" '+(String(value||opts.default||"")===String(o[0])?"selected":"")+'>'+esc(o[1])+'</option>').join("")+'</select>';else html+='<input id="'+name+'" name="'+name+'" type="'+(type||"text")+'" value="'+esc(value||"")+'" placeholder="'+esc(opts.placeholder||"")+'" '+(opts.min!==undefined?'min="'+opts.min+'"':"")+' '+(opts.step?'step="'+opts.step+'"':"")+' '+(opts.required?'required':"")+'>';if(opts.help)html+='<div class="form-help">'+opts.help+'</div>';return html+'</div>'}
function showModal(title,subtitle,body,submitText,formName){document.getElementById("modalRoot").innerHTML='<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="modal-header"><div><h2>'+title+'</h2><p>'+subtitle+'</p></div><button class="close-btn" type="button" data-action="close-modal" aria-label="닫기">×</button></div><form id="activeForm" data-form="'+formName+'">'+body+'<div class="form-footer"><button type="button" class="btn btn-white" data-action="close-modal">취소</button><button type="submit" class="btn btn-primary">'+submitText+'</button></div></form></section></div>';const first=document.querySelector("#activeForm input,#activeForm textarea,#activeForm select");if(first)first.focus()}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function openPlanForm(pid){const p=pid?getPlan(pid):null, v=p?currentPlanSnapshot(p):{};const body='<div class="form-grid">'+inputField("계획 이름 *","title",v.title,"text",{required:true,full:true,placeholder:"예: 자격증 공부, 이사 준비, 취미 프로젝트"})+inputField("분류","category",v.category,"select",{options:[["일상","일상"],["학습","학습"],["업무","업무"],["취미","취미"],["게임","게임"],["건강","건강"],["재정","재정"],["기타","기타"]]})+inputField("예상 시간 (분)","estimatedMinutes",v.estimatedMinutes,"number",{min:0,step:5,placeholder:"예: 300"})+inputField("시작일","startDate",v.startDate,"date")+inputField("종료일 / 목표일","endDate",v.endDate,"date")+inputField("설명","description",v.description,"textarea",{full:true,placeholder:"이 계획을 세운 이유나 배경"})+inputField("성공 기준","successCriteria",v.successCriteria,"textarea",{full:true,placeholder:"무엇을 달성하면 성공이라고 볼까요?"})+'</div>';showModal(p?"계획 수정하기 ✿":"새 계획 만들기 ✿",p?"수정 전 버전은 변경 이력에 보존됩니다.":"목표와 성공 기준, 예상 시간을 차근차근 적어보세요.",body,p?"변경 내용 저장":"계획 저장",p?"edit-plan":"new-plan");document.getElementById("activeForm").dataset.id=pid||""}
function openTaskForm(tid,planId){const t=tid?getTask(tid):null;const options=[["","계획에 연결하지 않음"]].concat(data.plans.map(p=>[p.id,p.title]));const body='<div class="form-grid">'+inputField("할 일 이름 *","title",t?t.title:"","text",{required:true,full:true,placeholder:"예: 20분 복습하기"})+inputField("연결할 계획","planId",t?t.planId:(planId||""),"select",{options:options})+inputField("상태","status",t?t.status:"todo","select",{options:[["todo","할 일"],["inprogress","진행 중"],["done","완료"]]})+inputField("마감일","dueDate",t?t.dueDate:"","date")+inputField("우선순위","priority",t?t.priority:"medium","select",{options:[["high","높음"],["medium","보통"],["low","낮음"]]})+inputField("예상 시간 (분)","estimatedMinutes",t?t.estimatedMinutes:30,"number",{min:0,step:5})+inputField("태그","tags",t?(t.tags||[]).join(", "):"","text",{full:true,placeholder:"예: 준비, 복습, 집"})+inputField("설명 / 메모","description",t?t.description:"","textarea",{full:true,placeholder:"할 일에 대한 세부 사항"})+'</div>';showModal(t?"할 일 수정하기 ☑":"새 할 일 추가 ☑","검색과 필터, 우선순위에 사용할 정보를 설정해요.",body,t?"변경 내용 저장":"할 일 저장",t?"edit-task":"new-task");document.getElementById("activeForm").dataset.id=tid||""}
function openRunForm(taskId){const t=taskId?getTask(taskId):null;const taskOptions=[["","특정 할 일과 연결하지 않음"]].concat(data.tasks.map(x=>[x.id,x.title]));const body='<div class="form-grid">'+inputField("기록 제목 *","title",t?"실행: "+t.title:"","text",{required:true,full:true,placeholder:"예: 문제 풀이, 산책, 자료 정리"})+inputField("연결할 할 일","taskId",taskId||"","select",{options:taskOptions,full:true})+inputField("실제 시작 시각","startedAt",dateInputNow(),"datetime-local")+inputField("실제 종료 시각 (선택)","endedAt","","datetime-local")+inputField("소요 시간 (분)","durationMinutes","","number",{min:0,step:5,placeholder:"종료 시각을 비우면 직접 입력"})+inputField("막힌 부분","blocker","","textarea",{full:true,placeholder:"어디서 막혔나요? 무엇이 어려웠나요?"})+inputField("메모 / 배운 점","note","","textarea",{full:true,placeholder:"다음에 참고하고 싶은 내용"})+'</div><div class="form-help" style="margin-top:11px">종료 시각을 입력하면 소요 시간을 자동 계산합니다. 종료 시각이 없다면 소요 시간(분)을 직접 입력하세요. 이 값은 원래 계획과 별도로 저장됩니다.</div>';showModal("실행 기록 남기기 ◷","실제로 언제 시작했고, 얼마나 걸렸는지 적어보세요.",body,"기록 저장","new-run")}
function showPlanHistory(pid){const p=getPlan(pid);if(!p)return;const arr=(p.history||[]).slice().sort((a,b)=>b.version-a.version);const item=h=>'<div class="history-row"><strong>버전 '+h.version+' · '+esc(h.title)+'</strong><small>저장 '+fmtDate(h.savedAt,true)+' · 예상 시간 '+fmtMinutes(h.estimatedMinutes)+'</small>'+(h.startDate||h.endDate?'<div class="history-diff">'+esc(h.startDate||"시작일 미정")+' ~ '+esc(h.endDate||"종료일 미정")+'</div>':"")+(h.successCriteria?'<div class="history-diff"><b>성공 기준</b><br>'+esc(h.successCriteria)+'</div>':"")+(h.description?'<div class="history-diff">'+esc(h.description)+'</div>':"")+'</div>';showModal("계획 변경 이력 ✿",p.title+" · 현재 버전 "+(p.versionNo||1),'<div class="hint-box">현재 계획은 버전 '+(p.versionNo||1)+'입니다. 이전 버전은 읽기 전용으로 보존됩니다.</div><div style="margin-top:13px"><div class="history-row"><strong>현재 버전 '+(p.versionNo||1)+' · '+esc(p.title)+'</strong><small>최근 수정 '+fmtDate(p.updatedAt,true)+' · 예상 시간 '+fmtMinutes(p.estimatedMinutes)+'</small><div class="history-diff"><b>성공 기준</b><br>'+esc(p.successCriteria||"기록 없음")+'</div><div class="history-diff">'+esc(p.description||"설명 없음")+'</div></div>'+arr.map(item).join("")+'</div>','닫기','history');document.querySelector('#activeForm .form-footer').innerHTML='<button type="button" class="btn btn-primary" data-action="close-modal">닫기</button>';document.querySelector('#activeForm').addEventListener("submit",e=>{e.preventDefault();closeModal()})}
function handleSubmit(form){const fd=new FormData(form),v=Object.fromEntries(fd.entries()),kind=form.dataset.form,pid=form.dataset.id||"";if(kind==="new-plan"||kind==="edit-plan"){const title=String(v.title||"").trim();if(!title){showToast("계획 이름을 적어주세요.");return}const fields={title:title,category:v.category||"기타",description:String(v.description||"").trim(),startDate:v.startDate||"",endDate:v.endDate||"",successCriteria:String(v.successCriteria||"").trim(),estimatedMinutes:Math.max(0,Number(v.estimatedMinutes)||0),status:"active"};if(kind==="new-plan"){data.plans.push(Object.assign({id:id(),createdAt:nowISO(),updatedAt:nowISO(),versionNo:1,history:[]},fields));save();closeModal();render();showToast("새 계획을 저장했어요 ✿")}else{const p=getPlan(pid);if(!p)return;const old=currentPlanSnapshot(p);if(JSON.stringify(old)!==JSON.stringify(fields)){p.history=p.history||[];p.history.push(Object.assign({},old,{version:p.versionNo||1,savedAt:p.updatedAt||p.createdAt||nowISO()}));p.versionNo=(p.versionNo||1)+1;Object.assign(p,fields,{updatedAt:nowISO()});save();closeModal();render();showToast("이전 계획을 보존하고 수정했어요.")}else{closeModal();showToast("변경된 내용이 없어요.")}}return}
if(kind==="new-task"||kind==="edit-task"){const title=String(v.title||"").trim();if(!title){showToast("할 일 이름을 적어주세요.");return}const fields={title:title,planId:v.planId||null,status:v.status||"todo",dueDate:v.dueDate||"",priority:v.priority||"medium",estimatedMinutes:Math.max(0,Number(v.estimatedMinutes)||0),tags:String(v.tags||"").split(",").map(x=>x.trim()).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i),description:String(v.description||"").trim()};if(kind==="new-task"){const t=Object.assign({id:id(),createdAt:nowISO(),updatedAt:nowISO(),completedAt:null},fields);data.tasks.push(t);if(t.status==="done")recordCompletion(t);save();closeModal();setPage("tasks");showToast(t.status==="done"?"완료 이력도 함께 기록했어요.":"할 일을 추가했어요 ☑")}else{const t=getTask(pid);if(!t)return;const before=t.status;Object.assign(t,fields,{updatedAt:nowISO()});if(before!=="done"&&t.status==="done")recordCompletion(t);else if(before==="done"&&t.status!=="done")t.completedAt=null;save();closeModal();render();showToast("할 일 정보를 수정했어요.")}return}
if(kind==="new-run"){const title=String(v.title||"").trim();if(!title){showToast("기록 제목을 적어주세요.");return}const task=v.taskId?getTask(v.taskId):null;let mins=Math.max(0,Number(v.durationMinutes)||0);const start=v.startedAt?new Date(v.startedAt).toISOString():nowISO();if(v.endedAt){const end=new Date(v.endedAt);const st=new Date(start);if(end<st){showToast("종료 시각은 시작 시각보다 빠를 수 없어요.");return}mins=Math.max(0,Math.round((end-st)/60000))}const run={id:id(),taskId:task?task.id:null,planId:task?task.planId:null,taskTitleSnapshot:task?task.title:"",title:title,startedAt:start,endedAt:v.endedAt?new Date(v.endedAt).toISOString():null,durationMinutes:mins,blocker:String(v.blocker||"").trim(),note:String(v.note||"").trim(),createdAt:nowISO()};data.runs.push(run);save();closeModal();setPage("activity");showToast("실행 기록을 저장했어요 ◷")}}
function recordCompletion(t){if(!t||t.status!=="done")return;t.completionCycle=(Number(t.completionCycle)||0)+1;data.completionEvents.push({id:id(),taskId:t.id,taskTitleSnapshot:t.title,cycleKey:String(t.completionCycle),at:nowISO()});t.completedAt=nowISO()}
function completeTask(tid){const t=getTask(tid);if(!t||t.status==="done")return;t.status="done";t.updatedAt=nowISO();t.completionCycle=(Number(t.completionCycle)||0)+1;data.completionEvents.push({id:id(),taskId:t.id,taskTitleSnapshot:t.title,cycleKey:String(t.completionCycle),at:nowISO()});t.completedAt=nowISO();save();render();showToast("완료 기록을 한 번 남겼어요! 🎉")}
function reopenTask(tid){const t=getTask(tid);if(!t||t.status!=="done")return;t.status="inprogress";t.completedAt=null;t.updatedAt=nowISO();save();render();showToast("진행 중으로 되돌렸어요. 이전 완료 이력은 보존됩니다.")}
function exportData(){const payload={app:"Mellow Diary",schemaVersion:1,exportedAt:nowISO(),data:data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="mellow-diary-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url);showToast("백업 파일을 내려받았어요. 안전한 곳에 보관하세요.")}
function importDataFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result||""));const d=parsed.data||parsed;if(!Array.isArray(d.plans)||!Array.isArray(d.tasks)||!Array.isArray(d.runs)||!Array.isArray(d.completionEvents))throw new Error("wrong schema");if(!confirm("현재 다이어리 데이터를 백업 파일의 내용으로 바꿀까요? 현재 상태를 먼저 내보내기 해두세요."))return;data={plans:d.plans,tasks:d.tasks,runs:d.runs,completionEvents:d.completionEvents};save();render();showToast("백업 데이터를 불러왔어요.")}catch(e){showToast("유효한 Mellow Diary 백업 파일이 아니에요.")}};reader.readAsText(file)}
function handleAction(el){const a=el.dataset.action,tid=el.dataset.id;if(!a)return;if(a==="new-plan")openPlanForm();else if(a==="edit-plan")openPlanForm(tid);else if(a==="plan-history")showPlanHistory(tid);else if(a==="new-task")openTaskForm("",el.dataset.plan||"");else if(a==="edit-task")openTaskForm(tid);else if(a==="complete-task")completeTask(tid);else if(a==="reopen-task")reopenTask(tid);else if(a==="delete-task"){const t=getTask(tid);if(t&&confirm("“"+t.title+"” 할 일을 삭제할까요? 실행 기록은 남겨두고 할 일만 목록에서 삭제합니다.")){data.tasks=data.tasks.filter(x=>x.id!==tid);data.runs.forEach(r=>{if(r.taskId===tid){r.taskTitleSnapshot=r.taskTitleSnapshot||t.title;r.taskId=null}});save();render();showToast("할 일을 삭제했어요. 관련 실행 기록은 보존했어요.")}}else if(a==="new-run")openRunForm(el.dataset.task||"");else if(a==="delete-run"){if(confirm("이 실행 기록을 삭제할까요?")){data.runs=data.runs.filter(r=>r.id!==tid);save();render();showToast("실행 기록을 삭제했어요.")}}else if(a==="close-modal"){closeModal()}else if(a==="export-data")exportData();else if(a==="import-data")document.getElementById("importInput").click();else if(a==="show-storage-note")showModal("저장 방식 안내 🔒","현재 버전의 데이터 보관에 대해 알아두세요.",'<div class="hint-box">현재 버전은 브라우저 localStorage를 사용합니다. 다이어리 데이터를 앱 서버나 데이터베이스로 전송하지 않기 때문에 서버 계정 설정 없이 바로 사용할 수 있어요.</div><div class="history-diff" style="margin-top:12px">주의: 브라우저 데이터를 삭제하거나 다른 브라우저·기기를 사용하면 데이터가 자동으로 이동하지 않습니다. 돌아보기 화면에서 JSON 백업을 주기적으로 내보내 보관하세요. 로그인과 기기 간 동기화가 필요하다면 별도의 Supabase 프로젝트 연결과 접근 정책 설정이 필요합니다.</div>','확인','history')}
document.addEventListener("click",e=>{const nav=e.target.closest("[data-page]");if(nav){setPage(nav.dataset.page);return}const action=e.target.closest("[data-action]");if(action){if(action.dataset.action==="close-modal"&&action.classList.contains("modal-backdrop")&&e.target!==action)return;handleAction(action)}});
document.addEventListener("submit",e=>{if(e.target&&e.target.id==="activeForm"){e.preventDefault();handleSubmit(e.target)}});
document.addEventListener("input",e=>{if(e.target.id==="taskSearch"){const pos=e.target.selectionStart;query=e.target.value;const root=document.getElementById("appContent");root.innerHTML=renderTasks();const input=document.getElementById("taskSearch");input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener("change",e=>{if(e.target.id==="statusFilter"){statusFilter=e.target.value;render()}else if(e.target.id==="priorityFilter"){priorityFilter=e.target.value;render()}else if(e.target.id==="tagFilter"){tagFilter=e.target.value;render()}else if(e.target.id==="sortMode"){sortMode=e.target.value;render()}else if(e.target.id==="importInput"){importDataFile(e.target.files&&e.target.files[0]);e.target.value=""}});
setPage("home");
})();
</script>
</body>
